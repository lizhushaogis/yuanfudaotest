<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本机浏览器测试Agent</title><style>body{max-width:960px;margin:30px auto;padding:0 20px;color:#263b45;background:#f5f7f8;font:16px/1.8 system-ui}section{background:white;border:1px solid #dce5e9;border-radius:12px;margin:20px 0;padding:24px}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:10px;border:1px solid #ccd8df;border-radius:7px}input:not([type=checkbox]),textarea{width:95%}button{cursor:pointer;background:#ecf5ef;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f6;padding:15px;max-height:400px;overflow:auto}img{max-width:100%;border:1px solid #ddd}small{color:#6d7d86}.error{color:#a43b2c}</style></head><body><h1>本机浏览器测试Agent</h1><p>模型观察实际网页，选择下一步；浏览器执行工具，程序保存证据。本版只验收“海洋深度→观察记录→重置”，不声称已测完15题或科学正确性。</p><section><h2>先验证执行器，不花API额度</h2><button id="broken">测试故意有缺陷的版本</button><button id="fixed">测试已修复版本</button><p><small>这两个按钮使用脚本驱动自测，不是LLM Agent。用于确认浏览器和判定器确实能区分失败/通过。</small></p></section><section><h2>再运行真正的模型驱动Agent</h2><label>测试模型API URL<input id="url" value="https://api.deepseek.com/v1"></label><label>测试模型名<input id="model" value="deepseek-flash"></label><label>API Key（仅留在本次本机任务内存中）<input id="key" type="password" autocomplete="off"></label><label>上传生成的HTML<input id="file" type="file" accept=".html,.htm"></label><label>或者粘贴HTML<textarea id="html" rows="4"></textarea></label><label><input id="consent" type="checkbox"> 同意将此HTML的页面文字与观察状态发送到上方模型；最多20轮模型调用、最长约2分钟，按供应商计费。</label><button id="start">启动测试Agent</button><button id="stop">停止当前任务</button><p><small>模型只收页面观察与工具结果，不收API Key。产物浏览器禁止外部网络，没有你的登录状态。浏览器隔离不是生产级安全沙箱：只测试你信任或已审查的生成产物，不上传内部敏感资料。</small></p></section><section><h2>执行结果</h2><p id="status" role="status">尚未运行</p><pre id="events"></pre><div id="result"></div><button id="download">下载报告</button></section><script>
const $=id=>document.getElementById(id);let token,job,report,busy=false;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',data){const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Agent-Token':token},...(data?{body:JSON.stringify(data)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
function lock(value){busy=value;for(const id of ['broken','fixed','start'])$(id).disabled=value;}
async function start(data){if(busy)return;try{lock(true);report=null;$('result').innerHTML='';if(!token)token=(await(await fetch('/session')).json()).token;job=(await api('/api/run','POST',data)).id;$('key').value='';while(true){const d=await api('/api/jobs/'+job);$('status').textContent=d.mode+' · '+d.status;$('events').textContent=d.events.map(e=>e.step+' '+e.kind+' '+JSON.stringify(e.data)).join('\n');if(d.status!=='running'){report=d.report;if(d.error)throw Error(d.error);$('status').textContent=({passed:'本题运行检查通过',failed:'发现实际运行缺陷',incomplete:'证据不足/中断，不能判通过','needs-review':'需复核运行错误'}[report.status]||report.status);$('result').innerHTML='<p>'+esc(report.scope)+'</p>'+(report.error?'<p class="error">'+esc(report.error)+'</p>':'')+report.assertions.map(a=>'<p>'+esc(a.name)+'：'+(a.passed?'通过':'失败')+'<br>'+esc(JSON.stringify(a))+'</p>').join('');for(const name of report.screenshots){const response=await fetch('/api/artifacts/'+report.id+'/'+name,{headers:{'X-Agent-Token':token}});if(response.ok){const img=document.createElement('img');img.alt=name;img.src=URL.createObjectURL(await response.blob());$('result').append(img);}}break;}await new Promise(r=>setTimeout(r,1000));}}catch(err){$('status').textContent=err.message;}finally{lock(false);}}
$('broken').onclick=()=>start({demo:'broken'});$('fixed').onclick=()=>start({demo:'fixed'});$('start').onclick=async()=>{if(!$('consent').checked)return $('status').textContent='先勾选本次调用确认';let html=$('html').value;const f=$('file').files[0];if(f){if(f.size>1000000)return $('status').textContent='文件超过1MB';html=await f.text();}start({html,consent:true,model:{url:$('url').value,model:$('model').value,key:$('key').value}});};$('stop').onclick=()=>{if(job)api('/api/jobs/'+job+'/stop','POST').catch(e=>$('status').textContent=e.message);};$('download').onclick=()=>{if(!report)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.download='agent-report.json';a.click();};
</script></body></html>
